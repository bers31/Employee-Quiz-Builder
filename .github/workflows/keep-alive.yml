name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        shell: bash
        run: |
          set -u

          URL="https://employee-quiz-builder-kdgdcd9rlvphaws8zspuu9.streamlit.app/"

          MAX_ATTEMPTS=5
          WAIT_SECONDS=30

          echo "========================================="
          echo "Streamlit Keep-Alive"
          echo "========================================="
          echo "URL: $URL"
          echo ""

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            echo "Attempt $attempt/$MAX_ATTEMPTS..."

            HTTP_STATUS=$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 15 \
              --max-time 90 \
              "$URL" 2>/dev/null)

            CURL_EXIT=$?

            echo "Curl exit code: $CURL_EXIT"
            echo "Final HTTP status: $HTTP_STATUS"

            if [ "$CURL_EXIT" -eq 0 ] && \
               [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then

              echo ""
              echo "========================================="
              echo "SUCCESS"
              echo "App is reachable."
              echo "Final HTTP status: $HTTP_STATUS"
              echo "========================================="

              exit 0
            fi

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "WARNING: Curl failed to connect to the app."
            elif [[ "$HTTP_STATUS" =~ ^3[0-9][0-9]$ ]]; then
              echo "WARNING: App still returned a redirect."
            elif [[ "$HTTP_STATUS" =~ ^4[0-9][0-9]$ ]]; then
              echo "WARNING: App returned a client error."
            elif [[ "$HTTP_STATUS" =~ ^5[0-9][0-9]$ ]]; then
              echo "WARNING: App returned a server error."
            else
              echo "WARNING: Unexpected response."
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in ${WAIT_SECONDS} seconds..."
              sleep "$WAIT_SECONDS"
            fi

          done

          echo ""
          echo "========================================="
          echo "FAILED"
          echo "========================================="
          echo "The Streamlit app could not be reached."
          echo "Tried $MAX_ATTEMPTS times."

          exit 1